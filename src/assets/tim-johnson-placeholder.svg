<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title description">
  <title id="title">Timothy Johnson partner plate</title>
  <desc id="description">An editorial identification plate for Timothy Johnson, Co-Founder and Partner at Thane and Reeve.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f2eb"/>
      <stop offset="100%" stop-color="#e8e2d6"/>
    </linearGradient>
    <pattern id="survey-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#161814" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .035"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#paper)"/>
  <rect width="600" height="800" fill="url(#survey-grid)"/>
  <rect width="600" height="800" filter="url(#grain)" opacity=".55"/>

  <g fill="none" stroke="#836634" stroke-width="1">
    <path d="M-20 170H148V92H426V212H620" stroke-opacity=".42"/>
    <path d="M-40 654L188 502L408 578L640 412" stroke-opacity=".28"/>
    <path d="M478-20V128H408V820" stroke-opacity=".22"/>
  </g>
  <g fill="#836634">
    <circle cx="148" cy="170" r="4" opacity=".72"/>
    <circle cx="408" cy="578" r="4" opacity=".58"/>
  </g>

  <rect x="26" y="26" width="548" height="748" fill="none" stroke="#161814" stroke-opacity=".22"/>
  <path d="M56 126H544M56 674H544" stroke="#161814" stroke-opacity=".18"/>

  <text x="56" y="76" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3.5" fill="#161814" opacity=".7">THANE &amp; REEVE</text>
  <text x="544" y="76" text-anchor="end" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#161814" opacity=".62">Partner plate · № 02</text>

  <text x="300" y="386" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="132" letter-spacing="18" fill="#161814">TJ</text>
  <text x="300" y="442" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#836634">&amp;</text>
  <path d="M248 472H352" stroke="#836634" stroke-width="1.5"/>

  <text x="300" y="538" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#161814">Timothy Johnson</text>
  <text x="300" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3.2" fill="#161814" opacity=".62">CO-FOUNDER · PARTNER · CPM</text>

  <text x="56" y="718" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.8" fill="#161814" opacity=".56">OPERATIONS · ASSET STRATEGY</text>
  <text x="544" y="718" text-anchor="end" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#161814" opacity=".62">Cambridge · MMXXVI</text>
  <text x="56" y="750" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2.4" fill="#836634" opacity=".8">LAND HELD · LAND MANAGED</text>
</svg>
