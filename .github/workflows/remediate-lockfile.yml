name: One-shot lockfile remediation

on:
  push:
    branches: [codex/launch-hardening-20260805]
    paths:
      - .github/workflows/remediate-lockfile.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/launch-hardening-20260805
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm audit fix --package-lock-only
      - run: git rm .github/workflows/remediate-lockfile.yml
      - name: Commit audited lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh audited lockfile"
          git push
